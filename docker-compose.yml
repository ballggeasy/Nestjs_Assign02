version: '3.8'

services:
  db:
    image: bitnami/postgresql:latest
    container_name: postgres_primary
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_USERNAME=${DB_USER:-postgres}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRESQL_DATABASE=${DB_NAME:-lab3_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_primary_data:/bitnami/postgresql

  db_replica:
    image: bitnami/postgresql:latest
    container_name: postgres_replica
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=db
      - POSTGRESQL_USERNAME=${DB_USER:-postgres}
      - POSTGRESQL_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/bitnami/postgresql
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend1:
    build: .
    container_name: backend1
    environment:
      - INSTANCE_ID=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=lab3_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    ports:
      - "3001:3000"
    depends_on:
      - db
      - redis

  backend2:
    build: .
    container_name: backend2
    environment:
      - INSTANCE_ID=2
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=lab3_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    ports:
      - "3002:3000"
    depends_on:
      - db
      - redis

  backend3:
    build: .
    container_name: backend3
    environment:
      - INSTANCE_ID=3
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=lab3_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
    ports:
      - "3003:3000"
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

volumes:
  postgres_primary_data:
  postgres_replica_data:
