events {
    worker_connections 1024;
}

http {
    # กำหนดกลุ่มของ backend server ด้วย directive upstream
    # ค่าเริ่มต้นจะใช้ algorithm แบบ round robin ในการกระจาย request
    upstream nestjs_backend {
        # Passive Health Check: 
        # ถ้ายิงไปหา instance นี้แล้วพัง (เช่น connection refused, timeout) เกิน max_fails ครั้ง 
        # ภายใน fail_timeout Nginx จะถอด instance นี้ออกจาก pool ชั่วคราว
        server backend1:3000 max_fails=3 fail_timeout=15s;
        server backend2:3000 max_fails=3 fail_timeout=15s;
        server backend3:3000 max_fails=3 fail_timeout=15s;
    }

    server {
        listen 80;

        location / {
            # ส่ง request ไปยังกลุ่ม backend ที่กำหนดไว้
            proxy_pass http://nestjs_backend;
            
            # ส่ง header ที่จำเป็นต่อไปยัง backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
